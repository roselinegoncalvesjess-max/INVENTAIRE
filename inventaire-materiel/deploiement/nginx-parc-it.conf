# Nginx devant l'application Parc IT (VPS)
# À copier dans /etc/nginx/sites-available/parc-it, en remplaçant parc.example.fr par le vrai domaine.
# Le certificat HTTPS est ensuite ajouté par : sudo certbot --nginx -d parc.example.fr
# (certbot complète ce fichier : écoute 443, certificat, redirection HTTP → HTTPS).

server {
    listen 80;
    listen [::]:80;
    server_name parc.example.fr;

    # Taille max. d'une requête (l'API accepte 1 Mo de JSON)
    client_max_body_size 2m;

    # Les en-têtes de sécurité (CSP, X-Frame-Options…) sont posés par l'application.
    # HSTS : le navigateur n'utilisera plus que HTTPS (ignoré tant que le site est servi en HTTP).
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
